name: Build ReaperPkg Zip Package

# Controls when the workflow will run
on:
# Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ main ]
  release:
    types: [ published ]

# Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: # Allows manual runs from the Actions tab

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  package-zip:
  
# The type of runner that the job will run on
    runs-on: ubuntu-latest

# Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout repository
# Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
        uses: actions/checkout@v4

# Runs a single command or a set of commands using the runners shell
      - name: Stage custom directory structure
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "BuyOne Scripts"

          # Copy specific files and folders into your custom layout
          rsync -av --exclude='/BuyOne Scripts/' --exclude='/.git/' ./ "BuyOne Scripts/"
        # cp -r src/* "staging/myfolder"
        # cp README.md LICENSE staging/docs/
        # cp config/prod.example.json staging/config/settings.json 

      - name: Create ZIP archive
        working-directory: "./BuyOne Scripts"
        run: zip -r "../BuyOne Scripts.ReaperPkg" .

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuyOne Scripts
          path: "BuyOne Scripts.ReaperPkg"

      - name: Attach ZIP to GitHub Release (if triggered by a release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: "BuyOne Scripts.ReaperPkg"
